name: APK Android

on:
  workflow_dispatch:
    inputs:
      firebase_required:
        description: 'Exigir Firebase configurado para este APK'
        type: boolean
        default: false
  push:
    paths:
      - 'android-carrito/**'
      - 'tests/test_pico_uart.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar movimiento continuo y parada
        run: python3 tests/test_pico_uart.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Restaurar firma de actualización
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/carrito-debug.keystore"
            chmod 600 "$RUNNER_TEMP/carrito-debug.keystore"
            echo "CARRITO_DEBUG_KEYSTORE=$RUNNER_TEMP/carrito-debug.keystore" >> "$GITHUB_ENV"
            echo 'Se usa la firma de actualización del APK anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configurar Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_REQUIRED: ${{ inputs.firebase_required || 'false' }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > android-carrito/app/google-services.json
            jq -e '.project_info.project_id and .project_info.firebase_url and any(.client[]; .client_info.android_client_info.package_name == "com.example.carritobluetooth")' android-carrito/app/google-services.json > /dev/null
            echo 'Firebase configurado para el APK.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FIREBASE_REQUIRED" = 'true' ]; then
            echo '::error::Falta el secreto FIREBASE_GOOGLE_SERVICES_JSON con la URL de Realtime Database.'
            exit 1
          else
            echo '::warning::APK con historial local. Firebase pendiente de configuración.'
            echo 'Historial local disponible. Firebase NO está conectado: falta FIREBASE_GOOGLE_SERVICES_JSON.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Probar y compilar APK 1.3
        run: gradle -p android-carrito --no-daemon testDebugUnitTest assembleDebug
      - name: Verificar firma de actualización
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-carrito/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/carrito-certificate.txt"
          if [ -n "$CARRITO_DEBUG_KEYSTORE" ]; then
            grep -F '38256712e0df0914e546c29e74ed017e35c0d29cf3efe492fc54a17bc9b2fdeb' "$RUNNER_TEMP/carrito-certificate.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: carrito-bluetooth-1.3-apk
          path: android-carrito/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-compilacion
          path: android-carrito/app/build/reports/
          if-no-files-found: ignore
