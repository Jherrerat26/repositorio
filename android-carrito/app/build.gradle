plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' version '4.4.4' apply false
}

// CI injects this file from a repository secret; never commit account credentials.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.example.carritobluetooth'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.carritobluetooth'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        debug {
            // Android tooling may override its default user directory on CI.
            // An explicit path ensures the original update key is actually used.
            def importedStore = System.getenv('CARRITO_DEBUG_KEYSTORE')
            if (importedStore) {
                storeFile file(importedStore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    testImplementation 'junit:junit:4.13.2'
}
